<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Ícono casa/edificio con V -->
  <g transform="translate(0,4)">
    <!-- Edificio izquierdo -->
    <rect x="8" y="20" width="10" height="28" fill="#13ecda" opacity="0.7" rx="1"/>
    <!-- Edificio central (más alto) -->
    <rect x="21" y="10" width="10" height="38" fill="#13ecda" rx="1"/>
    <!-- Edificio derecho -->
    <rect x="34" y="16" width="10" height="32" fill="#13ecda" opacity="0.85" rx="1"/>
    <!-- Ventanas edificio central -->
    <rect x="23" y="14" width="3" height="4" fill="#0a1a18" rx="0.5" opacity="0.6"/>
    <rect x="27" y="14" width="3" height="4" fill="#0a1a18" rx="0.5" opacity="0.6"/>
    <rect x="23" y="22" width="3" height="4" fill="#0a1a18" rx="0.5" opacity="0.6"/>
    <rect x="27" y="22" width="3" height="4" fill="#0a1a18" rx="0.5" opacity="0.6"/>
    <!-- V flecha hacia arriba -->
    <polyline points="52,44 62,24 72,44" fill="none" stroke="#13ecda" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="62,24 62,10" fill="none" stroke="#13ecda" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- Texto VEXO -->
  <text x="80" y="36" font-family="'Syne', 'Arial Black', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="1">VEXO</text>
  <!-- Texto REAL ESTATE -->
  <text x="81" y="48" font-family="'DM Sans', 'Arial', sans-serif" font-weight="400" font-size="9.5" fill="#13ecda" letter-spacing="3.5">REAL ESTATE</text>
  <!-- Línea decorativa -->
  <line x1="80" y1="38.5" x2="193" y2="38.5" stroke="#13ecda" stroke-width="0.5" opacity="0.3"/>
</svg>
