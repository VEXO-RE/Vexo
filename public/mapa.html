function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getImg(d) {
  // Prioridad: foto_principal_url → imagenes[0] → imagen_fallback
  if (d.foto_principal_url && d.foto_principal_url.length > 5) return d.foto_principal_url;
  if (Array.isArray(d.imagenes) && d.imagenes.length > 0 && d.imagenes[0].length > 5) return d.imagenes[0];
  if (d.imagen_fallback && d.imagen_fallback.length > 5) return d.imagen_fallback;
  return d.img || 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400&q=75';
}

function formatPrice(d) {
  if (!d.precio_desde || d.precio_desde === 0) return d.precio || '';
  const n = d.precio_desde;
  if (n >= 1000000) return '$' + (n/1000000).toFixed(1) + ' MDP';
  return '$' + n.toLocaleString('es-MX');
}

function createMarker(item) {
  const isDev = item.tipo === 'desarrollo';

  const el = document.createElement('div');
  el.style.cssText = `
    width: ${isDev ? 36 : 28}px; height: ${isDev ? 36 : 28}px;
    border-radius: 50%;
    background: ${isDev ? '#d4891a' : '#13ecda'};
    border: 2px solid ${isDev ? '#e8a92a' : 'rgba(19,236,218,0.5)'};
    box-shadow: 0 0 0 4px ${isDev ? 'rgba(212,137,26,0.25)' : 'rgba(19,236,218,0.15)'};
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
    font-size: ${isDev ? '16px' : '13px'};
  `;
  el.title = item.nombre;
  el.innerHTML = isDev ? '🏗' : '📍';
  el.addEventListener('mouseenter', () => el.style.transform = 'scale(1.3)');
  el.addEventListener('mouseleave', () => el.style.transform = 'scale(1)');

  const img = getImg(item);
  const chipsData = (item.datos || (item.precio_desde ? [`Desde ${formatPrice(item)}`, item.tipo] : [])).map(d => `<div class="popup-chip">${esc(d)}</div>`).join('');
  const precio = isDev ? formatPrice(item) : '';

  const popupHTML = `
    <img class="popup-img" src="${esc(img)}" alt="${esc(item.nombre)}" loading="lazy"
      onerror="this.src='https://images.unsplash.com/photo-1486325212027-8081e485255e?w=400&q=75'"/>
    <div class="popup-body">
      <div class="popup-cat ${isDev ? 'cat-desarrollo' : 'cat-poi'}">${isDev ? '⬡ Desarrollo VEXO' : '📍 Lugar de Interés'}</div>
      <div class="popup-title">${esc(item.nombre)}</div>
      <div class="popup-desc">${esc(item.descripcion || item.descripcion_corta || '')}</div>
      ${precio ? `<div class="popup-chip" style="margin-bottom:8px;background:rgba(212,137,26,0.15);color:var(--primary)">Desde ${precio}</div>` : ''}
      <div class="popup-data"><div class="popup-chip">${esc(item.categoria || item.tipo || '')}</div>${chipsData}</div>
      ${isDev
        ? `<button class="popup-btn" onclick="window.parent.showPage&&window.parent.showPage('desarrollos')">Ver desarrollo ➔</button>`
        : (item.link ? `<a href="${esc(item.link)}" target="_blank" class="popup-btn">Más información ➔</a>`
          : `<button class="popup-btn" onclick="window.parent.showPage&&window.parent.showPage('contacto')">Agendar visita ➔</button>`)
      }
    </div>
  `;

  const popup = new maplibregl.Popup({ offset: 18, maxWidth: '300px', closeButton: true })
    .setHTML(popupHTML);

  const marker = new maplibregl.Marker({ element: el })
    .setLngLat([parseFloat(item.lng), parseFloat(item.lat)])
    .setPopup(popup)
    .addTo(map);

  return { marker, item, el };
}

      ? 'cdmx'
      : (d.ciudad || '').toLowerCase().includes('playa') ? 'playa' : 'merida';
    const m = createMarker({
      ...d,
      tipo: 'desarrollo',
      ciudad: ciudad,
      categoria: `Desarrollo VEXO · ${d.tipo || ''}`,
      descripcion: d.descripcion_corta || `${d.estatus || 'Preventa'} en ${d.ciudad}. Desde ${formatPrice(d)}.`,
      datos: [
        d.estatus || 'Preventa',
        d.tipo || '',
        d.fecha_entrega ? `Entrega: ${d.fecha_entrega}` : ''
      ].filter(Boolean)
    });
    allMarkers.push({ ...m, ciudad, kind: 'desarrollo' });
  });

  // Markers de Lugares de Interés
  LUGARES_INTERES.forEach(poi => {
    const m = createMarker(poi);
    allMarkers.push({ ...m, ciudad: poi.ciudad, kind: 'poi' });
  });
});

// ── Filtros ──────────────────────────────────────────────────────────────────
function filterMap(filter, btn) {
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  allMarkers.forEach(({ marker, ciudad, kind }) => {
    const el = marker.getElement();
    let show = true;
    if (filter === 'merida')      show = ciudad === 'merida';
    else if (filter === 'playa')  show = ciudad === 'playa';
    else if (filter === 'cdmx')   show = ciudad === 'cdmx';
    else if (filter === 'desarrollos') show = kind === 'desarrollo';
    else if (filter === 'poi')    show = kind === 'poi';
    el.style.display = show ? '' : 'none';
  });

  if (filter === 'merida')      map.flyTo({ center: [-89.6237, 21.0500], zoom: 11, pitch: 40, duration: 1200 });
  else if (filter === 'playa')  map.flyTo({ center: [-87.0739, 20.6296], zoom: 12, pitch: 40, duration: 1200 });
  else if (filter === 'cdmx')   map.flyTo({ center: [-99.1669, 19.4270], zoom: 11, pitch: 40, duration: 1200 });
  else map.flyTo({ center: [-89.6237, 21.0500], zoom: 9, pitch: 30, duration: 1200 });
}
</script>
