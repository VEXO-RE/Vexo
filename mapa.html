    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d4891a;

      --bg: #07120f;
      --bg2: #0a1a18;
      --bg3: #0f2320;
      --glass: rgba(15,35,32,0.92);
      --text: #e2e8f0;
      --text-m: #94a3b8;
      --text-s: #64748b;
      --teal: #13ecda;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; }
    #map { width: 100%; height: 100vh; }

    /* ── Controles ── */
    #map-controls {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      background: rgba(7,18,15,0.9);
      border: 1px solid rgba(212,137,26,0.2);
      border-radius: 40px;
      padding: 6px 10px;
      backdrop-filter: blur(12px);
    }
    .ctrl-btn {
      padding: 7px 18px;
      border-radius: 30px;
      border: none;
      background: transparent;
      color: var(--text-m);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .ctrl-btn.active, .ctrl-btn:hover {
      background: var(--primary);
      color: #07120f;
    }

    /* ── Popup ── */
    .maplibregl-popup-content {
      background: var(--glass);
      border: 1px solid rgba(212,137,26,0.22);
      border-radius: 16px;
      padding: 0;
      overflow: hidden;
      min-width: 260px;
      max-width: 300px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
    }
    .maplibregl-popup-tip { border-top-color: rgba(212,137,26,0.22) !important; }
    .maplibregl-popup-close-button {
      color: var(--text-m);
      font-size: 18px;
      top: 8px;
      right: 10px;
      background: rgba(7,18,15,0.5);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      line-height: 22px;
      text-align: center;
    }

    .popup-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }
    .popup-body {
      padding: 14px 16px 16px;
    }
    .popup-cat {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .cat-desarrollo { background: rgba(212,137,26,0.2); color: var(--primary); }
    .cat-poi { background: rgba(19,236,218,0.12); color: var(--teal); }
    .popup-title {
      font-family: 'Syne', system-ui, sans-serif;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.2;
      margin-bottom: 6px;
      color: #fff;
    }
    .popup-desc {
      font-size: 12px;
      color: var(--text-m);
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .popup-data {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .popup-chip {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
    }
    .popup-btn {
      display: block;
      width: 100%;
      padding: 9px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-d));
      color: #07120f;
      font-weight: 700;
      font-size: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    /* ── Leyenda ── */
    #legend {
      position: absolute;
      bottom: 32px;
      left: 16px;
      z-index: 10;
      background: rgba(7,18,15,0.88);
      border: 1px solid rgba(212,137,26,0.18);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .leg-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-m); }
    .leg-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  </style>

// ════════════════════════════════════════════════════════════════
//  MAPA
// ════════════════════════════════════════════════════════════════
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [-89.6237, 21.0500],
  zoom: 11,
  pitch: 40,
  bearing: 0
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

// Guardar markers para filtrar
const allMarkers = [];

function createMarker(item) {
  const isDev = item.tipo === 'desarrollo';

  // Elemento del marcador
  const el = document.createElement('div');
  el.style.cssText = `
    width: ${isDev ? 36 : 28}px;
    height: ${isDev ? 36 : 28}px;
    border-radius: 50%;
    background: ${isDev ? '#d4891a' : '#13ecda'};
    border: 2px solid ${isDev ? '#e8a92a' : 'rgba(19,236,218,0.5)'};
    box-shadow: 0 0 0 4px ${isDev ? 'rgba(212,137,26,0.25)' : 'rgba(19,236,218,0.15)'};
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
    font-size: ${isDev ? '16px' : '13px'};
  `;
  el.title = item.nombre;
  el.innerHTML = isDev ? '🏢' : '📍';
  el.addEventListener('mouseenter', () => el.style.transform = 'scale(1.3)');
  el.addEventListener('mouseleave', () => el.style.transform = 'scale(1)');

  // Popup
  const chipsCat = `<div class="popup-chip">${item.categoria || item.tipo || ''}</div>`;
  const chipsData = (item.datos || (item.precio ? [`Desde ${item.precio}`, item.tipo] : [])).map(d => `<div class="popup-chip">${d}</div>`).join('');

  const popupHTML = `
    <img class="popup-img" src="${item.img}" alt="${item.nombre}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1486325212027-8081e485255e?w=400&q=75'"/>
    <div class="popup-body">
      <div class="popup-cat ${isDev ? 'cat-desarrollo' : 'cat-poi'}">${isDev ? '⭐ Desarrollo VEXO' : '📍 Lugar de Interés'}</div>
      <div class="popup-title">${item.nombre}</div>
      <div class="popup-desc">${item.descripcion || ''}</div>
      <div class="popup-data">${chipsCat}${chipsData}</div>
      ${isDev
        ? `<button class="popup-btn" onclick="window.parent.showPage&&window.parent.showPage('desarrollos')">Ver desarrollo →</button>`
        : (item.link ? `<a href="${item.link}" target="_blank" class="popup-btn">Más información →</a>` : `<button class="popup-btn" onclick="window.parent.showPage&&window.parent.showPage('contacto')">Agendar visita →</button>`)
      }
    </div>
  `;

  const popup = new maplibregl.Popup({ offset: 18, maxWidth: '300px', closeButton: true })
    .setHTML(popupHTML);

  const marker = new maplibregl.Marker({ element: el })
    .setLngLat([item.lng, item.lat])
    .setPopup(popup)
    .addTo(map);

  return { marker, item, el };
}

map.on('load', () => {
  // Edificios 3D
  try {
    const layers = map.getStyle().layers;
    const labelLayer = layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field']);
    const beforeId = labelLayer ? labelLayer.id : undefined;
    map.addLayer({
      id: 'buildings-3d',
      source: 'carto',
      'source-layer': 'building',
      type: 'fill-extrusion',
      minzoom: 13,
      paint: {
        'fill-extrusion-color': ['interpolate', ['linear'], ['get', 'height'],
          0, '#0f2320', 50, '#162b3a', 100, '#1b3a4b'],
        'fill-extrusion-height': ['get', 'height'],
        'fill-extrusion-base': ['get', 'min_height'],
        'fill-extrusion-opacity': 0.75
      }
    }, beforeId);
  } catch(e) {}

  // Agregar markers de desarrollos VEXO
  DESARROLLOS_VEXO.forEach(d => {
    const m = createMarker({ ...d, tipo: 'desarrollo', categoria: `Desarrollo VEXO · ${d.tipo}`,
      descripcion: `Preventa ${d.tipo} en ${d.ciudad === 'merida' ? 'Mérida' : d.ciudad === 'cdmx' ? 'Ciudad de México' : 'Playa del Carmen'}. Desde ${d.precio}.` });
    allMarkers.push({ ...m, ciudad: d.ciudad, kind: 'desarrollo' });
  });

  // Agregar markers de lugares de interés
  LUGARES_INTERES.forEach(poi => {
    const m = createMarker(poi);
    allMarkers.push({ ...m, ciudad: poi.ciudad, kind: 'poi' });
  });
});

// ── Filtros ────────────────────────────────────────────────────
function filterMap(filter, btn) {
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  allMarkers.forEach(({ marker, ciudad, kind }) => {
    const el = marker.getElement();
    let show = true;
    if (filter === 'merida') show = ciudad === 'merida';
    else if (filter === 'cdmx') show = ciudad === 'cdmx';
    else if (filter === 'desarrollos') show = kind === 'desarrollo';
    else if (filter === 'poi') show = kind === 'poi';
    el.style.display = show ? '' : 'none';
  });

  // Volar a la zona
  if (filter === 'merida') map.flyTo({ center: [-89.6237, 21.0500], zoom: 11, pitch: 40, duration: 1200 });
  else if (filter === 'cdmx') map.flyTo({ center: [-99.1669, 19.4270], zoom: 11, pitch: 40, duration: 1200 });
  else map.flyTo({ center: [-89.6237, 21.0500], zoom: 9, pitch: 30, duration: 1200 });
}
